<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 编辑器</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-actions">
          <button id="btn-new" class="side-action" title="新建 (⌘N)">新建</button>
          <button id="btn-open" class="side-action" title="打开 (⌘O)">打开</button>
        </div>
        <div class="sidebar-header">
          <span id="sidebar-title" class="sidebar-title">最近打开</span>
          <button id="recent-clear" class="sidebar-clear" title="清空全部记录" aria-label="清空全部记录">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.5 4h11M6 4V2.8c0-.44.32-.8.8-.8h2.4c.48 0 .8.36.8.8V4M4 4l.6 9.1c.03.5.44.9.94.9h4.92c.5 0 .9-.4.94-.9L12 4" />
            </svg>
          </button>
        </div>
        <div id="recent-list" class="recent-list"></div>
      </aside>

      <div class="main-col">
        <header class="toolbar">
          <div class="toolbar-group">
            <button id="sidebar-toggle" class="icon-btn" title="收起侧边栏 (⌘\)" aria-label="收起侧边栏">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="12" height="10" rx="1.6" />
                <line x1="6.4" y1="3" x2="6.4" y2="13" />
              </svg>
            </button>
            <button id="btn-save" class="toolbar-save" title="保存 (⌘S)">保存</button>
            <div class="export-wrap">
              <button id="btn-export" class="toolbar-export" type="button" title="导出">导出 ▾</button>
              <div id="export-menu" class="export-menu hidden">
                <button id="export-html" class="export-item" type="button">导出 HTML</button>
                <button id="export-pdf" class="export-item" type="button">导出 PDF</button>
              </div>
            </div>
          </div>

          <div class="toolbar-title">
            <span id="filename">未命名</span>
          </div>

          <div class="toolbar-group">
            <button id="lang-toggle" class="lang-btn" title="Switch to English">EN</button>
            <div class="mode-switch" role="tablist">
              <button id="mode-edit" class="active" title="编辑模式 (⌘E)">编辑</button>
              <button id="mode-read" title="阅读模式 (⌘E)">阅读</button>
            </div>
          </div>
        </header>

        <main class="content">
          <div id="editor" class="editor-pane"></div>
          <div id="read-view" class="read-view hidden">
            <nav id="outline" class="outline"></nav>
            <div id="preview" class="preview-pane markdown-body"></div>
          </div>
        </main>

        <!-- 查找/替换弹窗（右上角浮层，⌘F 唤起） -->
        <div id="find-popup" class="find-popup hidden">
          <div class="find-row">
            <input id="find-input" class="find-input" type="text" spellcheck="false" placeholder="查找" />
            <span id="find-count" class="find-count"></span>
            <button id="opt-case" class="find-opt" type="button" title="区分大小写">Aa</button>
            <button id="opt-word" class="find-opt" type="button" title="全字匹配">W</button>
            <button id="opt-regex" class="find-opt" type="button" title="正则表达式">.*</button>
            <span class="find-sep"></span>
            <button id="find-prev" class="find-icon-btn" type="button" title="上一个" aria-label="上一个">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4" /></svg>
            </button>
            <button id="find-next" class="find-icon-btn" type="button" title="下一个" aria-label="下一个">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4" /></svg>
            </button>
            <button id="find-close" class="find-icon-btn" type="button" title="关闭" aria-label="关闭">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8M12 4l-8 8" /></svg>
            </button>
          </div>
          <div class="find-row">
            <input id="replace-input" class="find-input" type="text" spellcheck="false" placeholder="替换" />
            <button id="replace-one" class="find-btn" type="button">替换</button>
            <button id="replace-all" class="find-btn" type="button">全部替换</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 导出 PDF 用：打印时只显示这里的渲染内容 -->
    <div id="print-area" class="print-area markdown-body"></div>
  </body>
</html>
